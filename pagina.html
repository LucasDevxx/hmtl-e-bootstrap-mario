<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Fonte -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <title>CyberEcho</title>

    <style>
        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at top right, #0f172a 0%, #0b1220 60%);
            color: #e5e7eb;
            font-family: 'Poppins', sans-serif;
        }

        .navbar-custom {
            background-color: rgba(11, 18, 32, 0.85);
            border-bottom: 1px solid #24324a;
        }

        .navbar-brand {
            color: #22c55e;
            font-weight: 700;
        }

        .nav-link {
            color: #e5e7eb;
            font-weight: 600;
        }

        .nav-link:hover {
            color: #22c55e;
        }

        .hero {
            padding: 90px 0 60px;
        }

        .hero-card {
            background: #111a2e;
            border: 1px solid #24324a;
            padding: 40px;
            border-radius: 20px;
        }

        .hero-tag {
            display: inline-block;
            background: rgba(34, 197, 94, 0.15);
            color: #22c55e;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .section-title {
            color: #22c55e;
            font-weight: 800;
        }

        .card-custom {
            background: #0f1a30;
            border: 1px solid #24324a;
            border-radius: 15px;
            overflow: hidden;
            height: 100%;
            transition: 0.3s;
        }

        .card-custom:hover {
            transform: translateY(-5px);
        }

        .card-img-top {
            height: 180px;
            object-fit: cover;
        }

        .btn-cyber {
            border: 1px solid #22c55e;
            color: #22c55e;
            background: transparent;
            font-weight: 600;
        }

        .btn-cyber:hover {
            background: #22c55e;
            color: #000;
        }

        footer {
            background: #050a14;
            border-top: 1px solid #24324a;
        }
    </style>
</head>
